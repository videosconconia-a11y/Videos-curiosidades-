<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El iceberg de GTA 6</title>
<style>
  :root { --pink:#ff3caa; --teal:#00ebd7; --bg:#0b0216; --txt:#f3e9ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px 16px; box-sizing:border-box; }
  video { height:min(82vh,900px); aspect-ratio:9/16; max-width:100%; border-radius:16px; background:#000; box-shadow:0 20px 60px rgba(255,60,170,.25); }
  p { margin:0; font-size:13px; opacity:.7; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <video src="gta6.mp4" controls playsinline preload="metadata"></video>
  <p>Voz IA (Piper, es_ES) y música sintetizada · animaciones originales</p>
</div>
</body>
</html>
