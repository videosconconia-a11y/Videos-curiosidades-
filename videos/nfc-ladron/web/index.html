<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Sabes lo que es una NFC?</title>
<style>
  :root { --cyan:#28ebff; --gold:#ffcd46; --bg:#04060f; --txt:#e8f1f8; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  .stage { height:min(82vh,900px); aspect-ratio:9/16; max-width:100%; border-radius:18px; overflow:hidden; background:#000;
    box-shadow:0 0 0 2px rgba(40,235,255,.35), 0 20px 70px rgba(40,235,255,.18); }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  h1 { margin:0; font-size:15px; letter-spacing:.25em; color:var(--cyan); font-weight:800; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>¿TÚ SABES LO QUE ES UNA NFC?</h1>
  <div class="stage"><video src="nfc.mp4" controls playsinline preload="metadata"></video></div>
</div>
</body>
</html>
