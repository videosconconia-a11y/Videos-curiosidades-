<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La rana de bosque</title>
<style>
  :root { --ice:#7fe3ff; --gold:#ffd64d; --bg:#05080f; --txt:#e8f1f8; --mut:#8aa0b4; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  video { height:min(82vh, 960px); max-width:100%; aspect-ratio:9/16; border-radius:16px; background:#000;
    box-shadow:0 20px 60px rgba(0,0,0,.6); }
  h1 { margin:0; font-size:18px; font-weight:800; text-align:center; }
  p { margin:0; color:var(--mut); font-size:13px; text-align:center; max-width:520px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>La rana que se congela… y vuelve a la vida</h1>
  <video src="rana.mp4" controls playsinline preload="metadata">
    <track kind="subtitles" srclang="es" label="Español" src="subtitulos.vtt">
  </video>
  <p>Voz en off: Piper TTS (es_ES «davefx»). Fotos: Wikimedia Commons (créditos en FUENTES.md).</p>
</div>
</body>
</html>
