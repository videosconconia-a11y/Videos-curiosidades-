<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La rana que se congela · con voz</title>
<style>
  :root { --ice:#7fe3ff; --gold:#ffd64d; --bg:#05080f; --panel:#0d1424; --txt:#e8f1f8; --mut:#8aa0b4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px; }
  .stage { position:relative; height:min(78vh, 900px); aspect-ratio:9/16; max-width:100%;
    border-radius:16px; overflow:hidden; background:#000; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(3,8,18,.62); backdrop-filter:blur(3px); transition:opacity .3s; }
  .start.hidden { opacity:0; pointer-events:none; }
  .start h1 { margin:0 18px; font-size:clamp(18px,3.2vh,26px); text-align:center; font-weight:800; letter-spacing:.3px; }
  .bigbtn { border:0; border-radius:999px; padding:16px 26px; font-size:18px; font-weight:800; cursor:pointer;
    background:var(--gold); color:#141005; box-shadow:0 8px 30px rgba(255,214,77,.35); }
  .bigbtn:active { transform:scale(.97); }
  .hold { position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:12px; padding:5px 10px; border-radius:999px;
    background:rgba(0,0,0,.55); color:var(--mut); opacity:0; transition:opacity .2s; }
  .hold.on { opacity:1; }
  .bar { width:min(100%, calc(min(78vh, 900px) * 9 / 16 + 80px)); background:var(--panel); border-radius:14px; padding:10px 12px;
    display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:8px; }
  .ctl { border:0; border-radius:10px; background:#1b2740; color:var(--txt); font-size:15px; padding:9px 12px; cursor:pointer; font-weight:700; }
  .ctl:hover { background:#24345a; }
  .prog { flex:1; height:8px; border-radius:99px; background:#1b2740; position:relative; cursor:pointer; }
  .prog i { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:99px; background:var(--ice); }
  .time { font-variant-numeric:tabular-nums; font-size:13px; color:var(--mut); min-width:76px; text-align:right; }
  select { flex:1; min-width:0; background:#1b2740; color:var(--txt); border:0; border-radius:10px; padding:8px; font-size:13px; }
  .status { font-size:12px; color:var(--mut); line-height:1.4; }
  .status b { color:var(--ice); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <video id="v" src="rana.mp4" playsinline preload="auto"></video>
    <div class="hold" id="hold">Esperando a que termine la frase…</div>
    <div class="start" id="start">
      <h1>La rana que se congela… y vuelve a la vida</h1>
      <button class="bigbtn" id="go">▶ Reproducir con voz</button>
    </div>
  </div>

  <div class="bar">
    <div class="row">
      <button class="ctl" id="pp" aria-label="Pausa">❚❚</button>
      <button class="ctl" id="rs" aria-label="Reiniciar">↺</button>
      <div class="prog" id="prog"><i id="fill"></i></div>
      <span class="time" id="tm">0:00 / 0:58</span>
    </div>
    <div class="row">
      <select id="voice" aria-label="Voz"></select>
    </div>
    <div class="status" id="st">Pulsa «Reproducir con voz». La voz se elige sola; puedes cambiarla en el menú.</div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- Guion (una frase por escena, con su inicio exacto en el vídeo)
const SCENES = [
  { t: 0.0,  text: "Este animal se congela por completo… y en primavera, vuelve a la vida." },
  { t: 4.5,  text: "Es la rana de bosque. Vive en Norteamérica, incluso por encima del Círculo Polar Ártico." },
  { t: 10.0, text: "Cuando llega el invierno, no huye ni se esconde bajo el agua. Se queda en el suelo del bosque, bajo las hojas… y deja que el hielo la atrape." },
  { t: 17.0, text: "Hasta el sesenta y cinco por ciento del agua de su cuerpo se convierte en hielo." },
  { t: 22.0, text: "Su corazón deja de latir. No respira. Su cerebro, sin actividad. A todos los efectos… parece muerta." },
  { t: 29.5, text: "¿El truco? Su hígado inunda el cuerpo de glucosa. Ese azúcar actúa como anticongelante y protege sus células del hielo." },
  { t: 37.5, text: "En Alaska, los científicos midieron ciento noventa y tres días seguidos congelada… a dieciocho grados bajo cero." },
  { t: 44.5, text: "Y con el deshielo, su corazón vuelve a latir… y en pocas horas, respira otra vez." },
  { t: 50.5, text: "Hoy, los científicos la estudian para aprender a conservar órganos. ¿Te dejarías congelar… si supieras que vas a despertar?" },
];
const VOICE = { lang: "es-ES", rate: 0.95, pitch: 1.0, volume: 1 };
const MUSIC_FULL = 0.9, MUSIC_DUCK = 0.12;     // la música baja mucho mientras habla la voz
let actx = null, gainNode = null;             // Web Audio: el volumen también funciona en iPhone
function setupAudio() {
  if (actx) { actx.resume && actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(v);
    gainNode = actx.createGain(); gainNode.gain.value = MUSIC_FULL;
    src.connect(gainNode); gainNode.connect(actx.destination);
  } catch (e) { actx = null; gainNode = null; }
}
function setMusic(level) {
  if (gainNode) gainNode.gain.setTargetAtTime(level, actx.currentTime, 0.12);
  else v.volume = level;
}

// ---------------------------------------------------------------- Estado
const v = document.getElementById("v"), go = document.getElementById("go"), startEl = document.getElementById("start");
const pp = document.getElementById("pp"), rs = document.getElementById("rs"), prog = document.getElementById("prog");
const fill = document.getElementById("fill"), tm = document.getElementById("tm"), sel = document.getElementById("voice");
const st = document.getElementById("st"), holdEl = document.getElementById("hold");
const synth = window.speechSynthesis;
let voices = [], chosen = null;
let voiceOn = false;        // modo narración activo
let spoken = -1;            // última escena cuya frase se ha lanzado
let speakingScene = -1;     // escena que está sonando ahora mismo
let holding = false;        // vídeo detenido por nosotros esperando a la voz
let token = 0;              // invalida callbacks de frases canceladas

// ---------------------------------------------------------------- Elección automática de la voz más natural
function score(vc) {
  const n = (vc.name + " " + vc.voiceURI).toLowerCase(), l = (vc.lang || "").toLowerCase().replace("_", "-");
  if (!l.startsWith("es")) return -1;
  let s = 0;
  if (l === "es-es") s += 50; else if (l === "es-us" || l === "es-mx") s += 25; else s += 15;
  if (/natural|neural/.test(n)) s += 45;
  if (/online/.test(n)) s += 20;
  if (/google/.test(n)) s += 30;
  if (/microsoft/.test(n)) s += 15;
  if (/premium|enhanced|mejorad|siri/.test(n)) s += 60;
  if (/(alvaro|álvaro|elvira|monica|mónica|jorge|helena|laura|dalia|ximena)/.test(n)) s += 8;
  if (/espeak|compact|eloquence|grandpa|grandma|bad news|zarvox/.test(n)) s -= 40;
  return s;
}
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(vc => score(vc) >= 0).sort((a, b) => score(b) - score(a));
  const prev = sel.value;
  sel.innerHTML = "";
  if (!voices.length) {
    sel.innerHTML = "<option>Sin voces en español en este dispositivo</option>"; sel.disabled = true; return;
  }
  sel.disabled = false;
  voices.forEach((vc, i) => {
    const o = document.createElement("option");
    o.value = vc.voiceURI; o.textContent = (i === 0 ? "★ " : "") + vc.name + " (" + vc.lang + ")";
    sel.appendChild(o);
  });
  sel.value = voices.some(x => x.voiceURI === prev) ? prev : voices[0].voiceURI;
  chosen = voices.find(x => x.voiceURI === sel.value);
  showStatus();
}
function showStatus(extra) {
  st.innerHTML = chosen ? "Voz: <b>" + chosen.name + "</b>" + (extra ? " · " + extra : "")
                        : (extra || "Este navegador no tiene voces en español instaladas.");
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); }
else showStatus("Este navegador no admite síntesis de voz.");
sel.onchange = () => { chosen = voices.find(x => x.voiceURI === sel.value); showStatus(); if (voiceOn) restartScene(); };

// ---------------------------------------------------------------- Narración
function sceneAt(t) { let i = 0; while (i + 1 < SCENES.length && t >= SCENES[i + 1].t - 0.02) i++; return i; }
function nextStart(i) { return i + 1 < SCENES.length ? SCENES[i + 1].t : (v.duration || 58.5) - 0.7; }

function speak(i) {
  if (!synth) return;
  const my = ++token;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(SCENES[i].text);
  if (chosen) u.voice = chosen;
  u.lang = chosen ? chosen.lang : VOICE.lang;
  u.rate = VOICE.rate; u.pitch = VOICE.pitch; u.volume = VOICE.volume;
  u.onstart = () => { if (my === token) setMusic(MUSIC_DUCK); };
  const done = () => {
    if (my !== token) return;
    speakingScene = -1; setMusic(MUSIC_FULL);
    if (holding) { holding = false; holdEl.classList.remove("on"); v.play().catch(() => {}); }
  };
  u.onend = done; u.onerror = done;
  speakingScene = i; spoken = i;
  synth.speak(u);
}
function stopVoice() { token++; if (synth) synth.cancel(); speakingScene = -1; setMusic(MUSIC_FULL); }

// Bucle de sincronización: lanza cada frase justo al empezar su escena y,
// si la voz va más lenta que el vídeo, congela la imagen en el corte hasta que termine.
function tick() {
  const t = v.currentTime, d = v.duration || 58.5;
  fill.style.width = (100 * t / d) + "%";
  tm.textContent = fmt(t) + " / " + fmt(d);
  if (voiceOn && !v.paused && !holding) {
    const i = sceneAt(t);
    if (i !== spoken && speakingScene === -1) speak(i);
    if (speakingScene !== -1 && t >= nextStart(speakingScene) - 0.04) {
      holding = true; holdEl.classList.add("on"); v.pause();
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function fmt(s) { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }

// Reanudar o saltar: siempre desde el inicio de la escena, para que la frase empiece con su imagen
function restartScene(t) {
  const i = sceneAt(t === undefined ? v.currentTime : t);
  stopVoice(); holding = false; holdEl.classList.remove("on");
  spoken = -1; v.currentTime = SCENES[i].t;
}

// ---------------------------------------------------------------- Controles
go.onclick = () => {
  voiceOn = true; setupAudio();
  if (synth) { synth.cancel(); synth.speak(new SpeechSynthesisUtterance("")); } // desbloquea el audio en móviles
  startEl.classList.add("hidden");
  stopVoice(); spoken = -1; holding = false;
  v.currentTime = 0; setMusic(MUSIC_FULL);
  v.play().catch(() => showStatus("Toca de nuevo para reproducir."));
};
pp.onclick = () => {
  if (!voiceOn) return go.onclick();
  if (v.paused && !holding) { restartScene(); v.play(); }
  else { holding = false; holdEl.classList.remove("on"); v.pause(); stopVoice(); spoken = -1; pp.textContent = "▶"; }
};
rs.onclick = () => { voiceOn = true; startEl.classList.add("hidden"); restartScene(0); v.play(); };
prog.onclick = (e) => {
  const r = prog.getBoundingClientRect(), t = (e.clientX - r.left) / r.width * (v.duration || 58.5);
  const wasPlaying = !v.paused || holding;
  restartScene(t);
  if (wasPlaying) v.play();
};
v.addEventListener("play", () => { pp.textContent = "❚❚"; });
v.addEventListener("pause", () => {
  if (!holding) { pp.textContent = "▶"; stopVoice(); spoken = -1; }   // pausa del usuario: la voz se para
});
v.addEventListener("ended", () => {
  stopVoice(); voiceOn = false; spoken = -1; pp.textContent = "▶";
  go.textContent = "↺ Ver otra vez con voz"; startEl.classList.remove("hidden");
});
document.addEventListener("visibilitychange", () => { if (document.hidden && !v.paused) v.pause(); });
</script>
</body>
</html>
