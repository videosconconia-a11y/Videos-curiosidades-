restaurante:
  nombre: "La Posada de Paco Benítez"                                   # ✅
  direccion: "Calle Guerrero Romero 5, esquina con Calle Alférez Díaz Otero, 52006 Melilla"  # ✅
  como_llegar: ""                     # ⚠️ PENDIENTE (una referencia o el parking más cercano)
  telefono_publico: "+34 952 68 16 29"  # ✅ aparece en una sola guía: confirmarlo
  web: ""                             # ⚠️ PENDIENTE (web o Instagram, si hay)
