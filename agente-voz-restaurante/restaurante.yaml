# Lo que el asistente puede contar: solo hechos publicados (✅). Lo demás, no lo sabe.
informacion: |
  Restaurante de cocina tradicional en el centro de Melilla, conocido sobre todo por la buena carne,
  el pescado fresco y el marisco, además de jamón y quesos de calidad.
  Platos más pedidos y recomendados: el rape a la Rusadir, que es el plato estrella de la casa;
  la corvina a la crema de gambas; y el solomillo, una receta que viene del anterior local de Paco, La Choza.
  Según el mercado hay pescados como el rape, la corvina o el lenguado.
  El local tiene una decoración rústica, con aperos de labranza antiguos.
  El propietario es Paco Benítez.
  Conviene reservar, sobre todo los fines de semana, porque suele llenarse.
  Datos que todavía NO tienes y que nunca debes inventar: precios, carta completa, menú del día,
  alérgenos de cada plato, opciones sin gluten, terraza, aparcamiento, accesibilidad, mascotas y formas de pago.
  Si preguntan por algo de esto, di con amabilidad que no tienes ese dato y que el personal se lo
  confirma en el restaurante o llamando en horario de servicio; si es por una alergia, anótalo en la reserva.
