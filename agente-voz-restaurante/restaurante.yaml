# ─────────────────────────────────────────────────────────────────────────────
#  LA POSADA DE PACO BENÍTEZ · MELILLA
#
#  ✅ = dato sacado de fuentes públicas (prensa y guías gastronómicas).
#  ⚠️ PENDIENTE = propuesta razonable que el restaurante TIENE QUE CONFIRMAR
#     antes de que el asistente coja llamadas de verdad.
#  Todo lo que el asistente cuenta sale de este archivo: si un dato está mal
#  aquí, se lo dirá mal al cliente.
